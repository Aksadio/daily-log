name: Daily contribution

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC = 12:00 noon in Bangladesh
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add today's line to the log
        run: |
          echo "$(date -u +%Y-%m-%d) - daily check-in" >> daily-log.md

      - name: Commit and push as the repo owner
        run: |
          # The commit must be authored by YOUR account, otherwise it does not
          # show up in your contribution graph.
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add daily-log.md
          git commit -m "Daily log $(date -u +%Y-%m-%d)"
          git push
